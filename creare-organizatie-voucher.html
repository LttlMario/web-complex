<!doctype html><html lang="ro" class="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Creează organizația · Panel</title><link rel="stylesheet" href="css/tailwind.css"><script src="js/supabase-config.js"></script><link rel="stylesheet" href="css/global-footer.css"></head><body class="min-h-screen bg-slate-950 text-slate-100"><main class="mx-auto max-w-2xl p-6"><section class="rounded-2xl border border-fuchsia-700/50 bg-slate-900 p-6"><h1 class="text-2xl font-black">Creează organizația prin voucher</h1><p class="mt-2 text-sm text-slate-400">Completează datele organizației. După salvare, administratorul poate finaliza rolurile, hook-urile și imaginea.</p><form id="create" class="mt-6 space-y-4"><label class="block text-sm">Voucher<input id="voucher" required class="mt-2 w-full rounded-xl border border-slate-700 bg-slate-950 p-3"></label><label class="block text-sm">Guild ID<input id="guild" required inputmode="numeric" class="mt-2 w-full rounded-xl border border-slate-700 bg-slate-950 p-3"></label><label class="block text-sm">Numele organizației<input id="name" required class="mt-2 w-full rounded-xl border border-slate-700 bg-slate-950 p-3"></label><label class="block text-sm">Adresa de lucru<input id="address" class="mt-2 w-full rounded-xl border border-slate-700 bg-slate-950 p-3"></label><button class="w-full rounded-xl bg-fuchsia-700 px-5 py-3 font-bold">Creează organizația Draft</button><p id="status" class="text-sm text-slate-400"></p></form></section></main><script>
document.getElementById('create').onsubmit = async e => {

    e.preventDefault();

    const status = document.getElementById('status');
    const config = window.PANEL_SUPABASE_CONFIG;

    const voucherInput = document.getElementById('voucher');
    const guildInput = document.getElementById('guild');
    const nameInput = document.getElementById('name');
    const addressInput = document.getElementById('address');

    const discordUser = JSON.parse(
        localStorage.getItem('discord_user') || '{}'
    );

    const data = {
        voucher_code: voucherInput.value.trim().toUpperCase(),
        guild_id: guildInput.value.trim(),
        name: nameInput.value.trim(),
        address: addressInput.value.trim(),
        discord_id: discordUser.discord_id || null
    };


    try {

        const response = await fetch(
            `${config.url}/functions/v1/create-voucher-organization`,
            {
                method: 'POST',
                headers:{
                    'Content-Type':'application/json',
                    apikey: config.publishableKey,
                    Authorization:`Bearer ${config.publishableKey}`
                },
                body:JSON.stringify(data)
            }
        );


        const result = await response.json();


        if(!response.ok){
            throw new Error(result.error || 'Crearea a eșuat.');
        }


        status.textContent =
            'Organizația Draft a fost creată. Administratorul poate continua configurarea.';


        e.querySelector('button').disabled=true;


    } catch(error){

        status.textContent = error.message;

    }

};
</script><script src="js/global-footer.js"></script></body></html>
<script>
const onboardingParams = new URLSearchParams(location.search);
if (onboardingParams.get('voucher')) document.getElementById('voucher').value = onboardingParams.get('voucher');
if (onboardingParams.get('guild')) document.getElementById('guild').value = onboardingParams.get('guild');
if (!onboardingParams.get('guild')) document.getElementById('guild').focus();
</script>
